name: docs-version

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-laravel}
      POSTGRES_DB: ${DB_DATABASE:-laravel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: docs-version-app:latest
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r "exit(@fsockopen(''127.0.0.1'', 9000) ? 0 : 1);"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    image: docs-version-app:latest
    restart: unless-stopped
    command: >
      php artisan queue:work database
      --sleep=3
      --tries=3
      --max-time=3600
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - app_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  app_vendor:
